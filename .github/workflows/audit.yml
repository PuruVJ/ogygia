name: Dependency audit

# Checks the dependencies of every PUBLISHED package (each non-private package under packages/:
# `ogygia`, `@ogygia/core`, the `@ogygia/*` plugins, the CLI…) against the npm advisory database:
# weekly (advisories appear without a commit), whenever the dependencies can change (the lockfile, the
# catalogs in pnpm-workspace.yaml, a package's package.json), and on demand. The report
# (.github/scripts/audit-report.ts) is split by how each advisory reaches a package: its dependencies,
# the peers the app installs, and this repository's dev tooling. It goes to the run's summary; on a PR,
# onto the PR as a comment (a same-repository PR: a fork's token cannot comment); otherwise into ONE
# open "Dependency audit" issue, updated in place (closed, the next run opens a new one). The job fails
# only when a published package's own dependency range cannot reach a fixed version of a high or
# critical advisory.

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches:
      - main
      - next
    paths:
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - 'packages/*/package.json'
  pull_request:
    paths:
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - 'packages/*/package.json'
      - .github/workflows/audit.yml
      - .github/scripts/audit-report.ts
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # the dependency tree the report classifies by (`pnpm list`); no build, no install scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit
        id: audit
        run: |
          set +e
          node .github/scripts/audit-report.ts > audit-report.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat audit-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file audit-report.md --edit-last --create-if-none

      - name: Update the audit issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create dependency-audit --color B60205 --description "The weekly dependency audit report" --force
          issue=$(gh issue list --label dependency-audit --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file audit-report.md
          else
            gh issue create --title "Dependency audit" --label dependency-audit --body-file audit-report.md
          fi

      - name: Fail on an advisory a fresh install of a published package would get
        if: steps.audit.outputs.code != '0'
        run: exit 1
