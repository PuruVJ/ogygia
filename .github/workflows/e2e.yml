name: e2e

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # a pull request runs only the specs its changes can break (e2e/affected.ts diffs against the
          # base branch, so it needs the history)
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22: adapter-vercel rejects unpinned bleeding-edge Node; 22 is a supported runtime.
          node-version: 22
          cache: pnpm

      # Bun runtime dimension — the adapter e2e suite runs the node-server output under bun too.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # turbo's local cache: a package whose inputs did not change replays its build and check
      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.workflow }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.workflow }}-
            turbo-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # wrangler (Cloudflare workerd) is fetched on demand by the suite via npx; warm it so the
      # cloudflare adapter boots the real Workers runtime instead of skipping.
      - name: Warm wrangler
        run: npx --yes wrangler --version

      # Root `check` (build:lib + svelte-check over lib/playground + e2e tsc) — the e2e suite
      # alone never runs it, which let type debt rot invisibly until upstream-watch tripped on it.
      - name: Type-check (build:lib, check:lib, check:playground, check:verify)
        run: pnpm run check

      # Playwright test runner (playwright.config.ts): globalSetup builds lib + playground, webServer
      # serves it, every spec under e2e/ runs (playground suites, self-booting fixture suites, the
      # adapters matrix). `pnpm run check` above already ran the Vitest browser-mode island tests.
      # A pull request: only the specs its changes can break (e2e/scope.ts: a plugin's own specs, its
      # dependents' and a smoke set; anything core-wide runs everything). A push to main/next, or a
      # manual run: the whole suite.
      - name: Run the e2e suite (verify + adapters, node + bun)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm run test:e2e:affected --base "origin/${{ github.base_ref }}"
          else
            pnpm run e2e
          fi
        env:
          OGYGIA_E2E_WRANGLER: '1'
          # Stable CI-only signing key so the warn-path probe's production build is silent (locally
          # this comes from apps/playground/.env, which is gitignored). NOT a production secret —
          # the Vercel deploy sets its own OGYGIA_SECRET.
          OGYGIA_SECRET: 3f9a2b7c1e5d8046af62c93b1d7e4058a6c2f19b3e8d70425c9a1f6b8d3e07c4

      # Traces (retained on failure) + the html report, for a red run.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
