name: pkg.pr.new

# Publishes a continuous PREVIEW build of `ogygia` for every push / PR, so a branch can be tested
# with `npm i https://pkg.pr.new/PuruVJ/ogygia@<sha-or-branch>` before anything hits npm.
# Requires the pkg.pr.new GitHub App installed on the repo: https://github.com/apps/pkg-pr-new

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build the library to dist (the published preview uses publishConfig.exports → dist).
      - run: pnpm run build:lib

      # A preview names itself: the next patch as a prerelease of this commit (`0.8.3-next.cb18746`),
      # so a report or a lockfile never mistakes it for the release it was built after. Only the
      # packed copy changes — nothing is committed.
      - run: |
          cd packages/ogygia
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));const [a,b,c]=p.version.split('-')[0].split('.').map(Number);p.version=a+'.'+b+'.'+(c+1)+'-next.'+process.env.GITHUB_SHA.slice(0,7);fs.writeFileSync('package.json',JSON.stringify(p,null,'\t')+'\n');console.log(p.version)"

      # `--pnpm` makes pkg.pr.new pack with `pnpm pack` instead of the default `npm pack`. Only pnpm
      # pack applies `publishConfig` (swapping the dev `exports` that point at `src/` for the `dist/`
      # map). Without it the preview shipped raw source exports pointing at files not in the tarball,
      # so `import … from 'ogygia'` failed with ERR_RESOLVE_PACKAGE_ENTRY_FAIL.
      # `--packageManager=pnpm`: the PR comment's install line reads `pnpm add …`, not `npm i …`.
      - run: npx --yes pkg-pr-new publish --pnpm --packageManager=pnpm './packages/ogygia'
